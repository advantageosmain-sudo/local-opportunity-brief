name: Frozen owner report operations (sync by default)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Sync only by default; owner sends require separate enabled Site pins and exact approval
        type: choice
        required: true
        default: sync
        options:
          - sync
          - owner_rehearsal_send
          - owner_rehearsal_reconcile
      report_id:
        description: Exact frozen owner-test report ID from evidence (no path)
        type: string
        required: true
      expected_checksum:
        description: Exact approved report SHA-256 (64 lowercase hex characters)
        type: string
        required: true
      expected_recipient:
        description: Exact owner email, required only for explicitly requested send or receipt reconciliation
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: owner-test-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and perform only the selected exact owner operation
        env:
          OWNER_REPORT_OPERATION: ${{ inputs.operation }}
          OWNER_REPORT_RECIPIENT: ${{ inputs.expected_recipient }}
          OWNER_REPORT_ID: ${{ inputs.report_id }}
          OWNER_REPORT_CHECKSUM: ${{ inputs.expected_checksum }}
          REPORT_SYNC_URL: ${{ vars.REPORT_SYNC_URL }}
          REPORT_SYNC_SECRET: ${{ secrets.REPORT_SYNC_SECRET }}
        run: node automation/sync-frozen-owner-test.mjs
