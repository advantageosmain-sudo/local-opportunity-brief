name: Validate business system

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run business:demo
      - run: npm run business:pilot
      - run: npm run business:batch
      - uses: actions/upload-artifact@v4
        with:
          name: validated-business-packets
          path: automation/outbox/
          if-no-files-found: error
