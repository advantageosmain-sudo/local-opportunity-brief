name: Generate weekly approval packet

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
    inputs:
      customer:
        description: Customer slug, or all active customers
        required: true
        default: all
      as_of:
        description: Report date (YYYY-MM-DD); leave blank to use today
        required: false
        default: ""
      approve_delivery:
        description: Keep as NO for review-only runs. APPROVE works for one verified customer only.
        type: choice
        required: true
        default: "NO"
        options:
          - "NO"
          - "APPROVE"

permissions:
  contents: read
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      customer: ${{ steps.inputs.outputs.customer }}
      as_of: ${{ steps.inputs.outputs.as_of }}
      mode: ${{ steps.inputs.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - id: inputs
        shell: bash
        env:
          INPUT_CUSTOMER: ${{ inputs.customer }}
          INPUT_AS_OF: ${{ inputs.as_of }}
        run: |
          customer="${INPUT_CUSTOMER:-all}"
          as_of="${INPUT_AS_OF:-$(date -u +%F)}"
          if [[ "${customer}" == "all" ]]; then
            mode="batch"
          else
            mode="single"
          fi
          echo "customer=${customer}" >> "$GITHUB_OUTPUT"
          echo "as_of=${as_of}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
      - name: Generate owner approval packet
        shell: bash
        run: |
          if [[ "${{ steps.inputs.outputs.mode }}" == "batch" ]]; then
            node automation/run-all.mjs --as-of "${{ steps.inputs.outputs.as_of }}"
          else
            node automation/run.mjs --customer "${{ steps.inputs.outputs.customer }}" --as-of "${{ steps.inputs.outputs.as_of }}"
          fi
      - name: Synchronize reports to the owner dashboard when configured
        shell: bash
        env:
          REPORT_SYNC_URL: ${{ vars.REPORT_SYNC_URL }}
          REPORT_SYNC_SECRET: ${{ secrets.REPORT_SYNC_SECRET }}
        run: |
          if [[ -z "${REPORT_SYNC_URL}" || -z "${REPORT_SYNC_SECRET}" ]]; then
            echo "Dashboard synchronization is not configured; the approval artifact is still complete."
            exit 0
          fi
          if [[ "${{ steps.inputs.outputs.mode }}" == "batch" ]]; then
            node automation/sync-dashboard.mjs --summary "automation/outbox/run-summary-${{ steps.inputs.outputs.as_of }}.json"
          else
            node automation/sync-dashboard.mjs --packet "automation/outbox/${{ steps.inputs.outputs.customer }}/${{ steps.inputs.outputs.as_of }}/dashboard-sync.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-brief-${{ steps.inputs.outputs.customer }}-${{ steps.inputs.outputs.as_of }}
          path: automation/outbox/
          if-no-files-found: error

  approve-and-deliver:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.approve_delivery == 'APPROVE' &&
          needs.generate.outputs.mode == 'single' }}
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: outbound-delivery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: weekly-brief-${{ needs.generate.outputs.customer }}-${{ needs.generate.outputs.as_of }}
          path: automation/outbox/
      - name: Bind owner approval to the exact report
        run: >-
          node automation/approve.mjs
          --report "automation/outbox/${{ needs.generate.outputs.customer }}/${{ needs.generate.outputs.as_of }}/report.json"
          --actor "${{ github.actor }}"
          --phrase APPROVE
      - name: Deliver the approved report
        env:
          LIVE_DELIVERY: "1"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DELIVERY_FROM_EMAIL: ${{ vars.DELIVERY_FROM_EMAIL }}
        run: >-
          node automation/deliver.mjs
          --report "automation/outbox/${{ needs.generate.outputs.customer }}/${{ needs.generate.outputs.as_of }}/report.json"
      - name: Synchronize the delivery receipt when configured
        env:
          REPORT_SYNC_URL: ${{ vars.REPORT_SYNC_URL }}
          REPORT_SYNC_SECRET: ${{ secrets.REPORT_SYNC_SECRET }}
        shell: bash
        run: |
          if [[ -n "${REPORT_SYNC_URL}" && -n "${REPORT_SYNC_SECRET}" ]]; then
            node automation/sync-dashboard.mjs --packet "automation/outbox/${{ needs.generate.outputs.customer }}/${{ needs.generate.outputs.as_of }}/dashboard-sync.json"
          fi
      - name: Preserve delivery diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: delivery-diagnostic-${{ needs.generate.outputs.customer }}-${{ needs.generate.outputs.as_of }}
          path: automation/outbox/${{ needs.generate.outputs.customer }}/${{ needs.generate.outputs.as_of }}/
          if-no-files-found: warn
      - name: Alert the owner in GitHub
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Delivery blocked: ${{ needs.generate.outputs.customer }} ${{ needs.generate.outputs.as_of }}`;
            const body = [
              "The protected delivery job stopped and did not complete successfully.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Open the attached delivery diagnostic artifact before retrying. Do not present this report as delivered unless a delivery receipt exists."
            ].join("\n");
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            if (!openIssues.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
